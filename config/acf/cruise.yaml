# ─────────────────────────────────────────────────────────────
# ACF profile: CRUISE  →  the "Cruise Page" content group
# (group_cruise_page_2026) on the `cruise` custom post type.
#
# Maps the document into the plugin-widget fields the Cruise Page renders:
#   quick_facts      → "At a Glance"     (Island QuickFacts widget)
#   feature_sections → "Cruise Page"     (Feature Sections widget, zig-zag)
#   cta              → "Plan Your Visit" (Island CTA widget)
#   faqs             → "FAQ"             (Island FAQs widget)
#
# The ORIGINAL "Cruise" group's general fields (cover, gallery, deck_plans,
# technical_specifications …) are authored/bound in Elementor and are NOT
# written here — this profile only fills the new Cruise Page content group.
#
# Field names on the right must match the ACF group; group needs Show in REST.
# ─────────────────────────────────────────────────────────────

mode: island
image_as: id

top_level:
  schema_jsonld: seo_schema

island:
  # Lead/overview paragraph that opens the doc, kept out of a title-less card.
  intro: intro
  author: author
  geo_answer: geo_answer

  # "At a Glance" facts grid (Capacity, Cabins, Length, Year …).
  quick_facts_title: quick_facts_title
  quick_facts_intro: quick_facts_intro
  quick_facts:
    field: quick_facts
    label: label
    value: value

  # One zig-zag section per document section (Vessel, History, Cabins, …).
  feature_sections:
    field: feature_sections
    title: title
    subtitle: subtitle
    content: content
    button_label: button_label
    button_url: button_url

  faqs:
    field: faqs
    question: question
    answer: answer

  # "Plan Your Visit" heading + intro that sit above the CTA cards.
  cta_title: cta_title
  cta_intro: cta_intro
  cta:
    field: cta
    audience: audience
    title: title
    text: text
    button_label: button_label
    button_url: button_url
