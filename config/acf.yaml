# ─────────────────────────────────────────────────────────────
# ACF mapping  —  PER-SITE.  This is where you match the engine's components
# to YOUR ACF field group. Change the right-hand values to your field names.
#
# Model: one ACF *flexible content* field whose rows are layouts. Each engine
# component (hero, rich_text, accordion, …) becomes one layout row:
#   { "acf_fc_layout": "<layout>", "<your_subfield>": <value>, ... }
#
# Values are written via the core REST `acf` payload, so every field group
# involved must have "Show in REST API" enabled (ACF 6.x). See docs/ACF.md.
#
# A reference field group matching these defaults is in
# wordpress-acf/page-builder.acf.json (importable into ACF).
# ─────────────────────────────────────────────────────────────

# The ACF flexible-content field that holds the page's stacked sections.
flexible_field: page_sections

# Used when a component type has no mapping below (content coerced to HTML).
fallback_layout: rich_text

# Non-flexible (top-level) ACF fields on the post.
top_level:
  subtitle: page_subtitle      # set "" to skip
  schema_jsonld: seo_schema    # JSON-LD string; set "" to skip

# How images are stored: "id" (attachment ID, ACF default) or "url".
image_as: id
# How plain bullet lists are stored: "newline" (textarea), "array", or "html".
list_as: html

layouts:
  hero:
    layout: hero
    fields: { heading: heading, subheading: subheading, eyebrow: eyebrow, image: image, ctas: buttons }
    repeaters: { ctas: { label: label, url: url } }

  rich_text:
    layout: rich_text
    fields: { heading: heading, content: content }

  bullets:
    layout: list
    fields: { heading: heading, items: items }

  image:
    layout: image
    fields: { image: image, caption: caption, alt: alt }

  gallery:
    layout: gallery
    fields: { heading: heading, images: images }

  callout:
    layout: callout
    fields: { variant: style, title: title, content: content }

  accordion:
    layout: faq
    fields: { heading: heading, items: items }
    repeaters: { items: { question: question, answer: answer } }

  stats:
    layout: stats
    fields: { heading: heading, items: items }
    repeaters: { items: { value: value, label: label } }

  cta:
    layout: cta
    fields: { heading: heading, content: content, ctas: buttons }
    repeaters: { ctas: { label: label, url: url } }

  quote:
    layout: quote
    fields: { text: text, citation: citation }

  columns:
    layout: columns
    fields: { columns: columns }
    repeaters: { columns: { content: content } }

  html:
    layout: html
    fields: { content: content }
