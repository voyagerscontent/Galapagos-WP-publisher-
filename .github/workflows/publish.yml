name: Publish to WordPress

# Run entirely from GitHub.com — no local machine needed.
#
# 1. Add your document to the repo (e.g. drop a .docx/.md/.txt into content/
#    via "Add file → Upload files").
# 2. Go to the Actions tab → "Publish to WordPress" → "Run workflow".
# 3. Fill in the file path and choose what to do.
#
# Requires three repository secrets (Settings → Secrets and variables →
# Actions): WP_BASE_URL, WP_USERNAME, WP_APP_PASSWORD.
# See docs/PUBLISH_VIA_GITHUB.md.

on:
  workflow_dispatch:
    inputs:
      file:
        description: "Path to the document, or 'ALL_ISLANDS' (content/*-island.docx) / 'ALL_WILDLIFE' (content/wildlife/*.docx)"
        required: true
        type: string
      mode:
        description: "What to do"
        required: true
        default: preview
        type: choice
        options:
          - preview          # build only, no publishing (downloadable artifact)
          - publish-draft    # create/update a DRAFT in WordPress
          - publish-live     # publish LIVE on the site
      page_type:
        description: "Force a page type (blank = auto-detect): blog_post | destination | tour | cruise | itineraries | experts | wildlife_single. cruise publishes to the cruise CPT; itineraries & experts publish as pages carrying the gp_page_type marker. ALL_WILDLIFE forces wildlife_single automatically."
        required: false
        type: string
      slug:
        description: "Override the page slug (blank = derive from the doc). Use for an isolated test page, e.g. santa-fe-island-test"
        required: false
        type: string
      test_mode:
        description: "Test page? Appends '-test' to the slug so it never collides with a real page."
        required: true
        default: true
        type: boolean
      media:
        description: "Media strategy"
        required: true
        default: placeholder
        type: choice
        options:
          - placeholder      # insert 'image needed' blocks for a human
          - library          # reuse best match from the WP Media Library
      update_existing:
        description: "Overwrite an existing post with the same slug? (off = refuse, safe default)"
        required: true
        default: false
        type: boolean
      only_fields:
        description: "Surgical: write ONLY these ACF fields (comma-separated, e.g. related_links). Blank = full publish. Never creates a page."
        required: false
        type: string

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the publisher
        run: pip install -e .

      - name: Run
        env:
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          # Inputs are passed through the environment (never interpolated
          # directly into the shell) to avoid script injection.
          IN_FILE: ${{ inputs.file }}
          IN_MODE: ${{ inputs.mode }}
          IN_TYPE: ${{ inputs.page_type }}
          IN_MEDIA: ${{ inputs.media }}
          IN_SLUG: ${{ inputs.slug }}
          IN_TEST: ${{ inputs.test_mode }}
          IN_UPDATE: ${{ inputs.update_existing }}
          IN_ONLY: ${{ inputs.only_fields }}
        run: |
          set -euo pipefail

          # Build the list of files to process. 'ALL_ISLANDS' expands to every
          # island doc (content/*-island.docx); 'ALL_WILDLIFE' to every species
          # doc (content/wildlife/*.docx); otherwise it's the single file.
          FILES=()
          PER_FILE_SLUG=false
          SLUG_KIND=""                    # island | wildlife (how to derive the slug)
          if [ "${IN_FILE}" = "ALL_ISLANDS" ]; then
            shopt -s nullglob
            FILES=(content/*-island.docx)
            PER_FILE_SLUG=true            # derive each slug from its filename
            SLUG_KIND="island"
            if [ ${#FILES[@]} -eq 0 ]; then
              echo "::error::ALL_ISLANDS matched no content/*-island.docx files"; exit 1
            fi
          elif [ "${IN_FILE}" = "ALL_WILDLIFE" ]; then
            shopt -s nullglob
            FILES=(content/wildlife/*.docx)
            PER_FILE_SLUG=true            # slug = basename (e.g. giant-tortoise)
            SLUG_KIND="wildlife"
            if [ -z "${IN_TYPE}" ]; then IN_TYPE="wildlife_single"; fi
            if [ ${#FILES[@]} -eq 0 ]; then
              echo "::error::ALL_WILDLIFE matched no content/wildlife/*.docx files"; exit 1
            fi
          else
            # The file may have been committed microseconds before this run was
            # dispatched — n8n commits the doc then immediately fires the dispatch,
            # and GitHub can resolve the ref to the PRE-commit SHA (replication
            # lag), so checkout@v4 lands before the file exists. Re-fetch the
            # branch tip and retry so the automation self-heals that race.
            if [ ! -f "${IN_FILE}" ]; then
              for attempt in 1 2 3 4 5; do
                echo "::notice::'${IN_FILE}' not present yet (attempt ${attempt}); re-fetching ${GITHUB_REF_NAME}…"
                git fetch --quiet origin "${GITHUB_REF_NAME}" || true
                git checkout --quiet FETCH_HEAD -- "${IN_FILE}" 2>/dev/null || true
                if [ -f "${IN_FILE}" ]; then break; fi
                sleep 5
              done
            fi
            if [ ! -f "${IN_FILE}" ]; then
              echo "::error::File not found in repo after retries: ${IN_FILE}"; exit 1
            fi
            FILES=("${IN_FILE}")
          fi

          TYPE_ARGS=()
          if [ -n "${IN_TYPE}" ]; then TYPE_ARGS=(--type "${IN_TYPE}"); fi
          TEST_ARGS=()
          if [ "${IN_TEST}" = "true" ]; then TEST_ARGS=(--test); fi
          UPDATE_ARGS=()
          if [ "${IN_UPDATE}" = "true" ]; then UPDATE_ARGS=(--update); fi
          ONLY_ARGS=()
          if [ -n "${IN_ONLY}" ]; then ONLY_ARGS=(--only-fields "${IN_ONLY}"); fi

          FAILED=()
          for f in "${FILES[@]}"; do
            SLUG_ARGS=()
            if [ "${PER_FILE_SLUG}" = "true" ]; then
              base="$(basename "$f" .docx)"     # e.g. baltra-island / giant-tortoise
              if [ "${SLUG_KIND}" = "island" ]; then
                base="${base%-island}"          # e.g. baltra
              fi                                 # wildlife: basename is already the slug
              SLUG_ARGS=(--slug "${base}")
            elif [ -n "${IN_SLUG}" ]; then
              SLUG_ARGS=(--slug "${IN_SLUG}")
            fi

            echo "::group::${f}"
            set +e
            case "${IN_MODE}" in
              preview)
                wp-publish preview "$f" "${TYPE_ARGS[@]}" "${SLUG_ARGS[@]}" "${TEST_ARGS[@]}" --media "${IN_MEDIA}"
                ;;
              publish-draft)
                wp-publish publish "$f" "${TYPE_ARGS[@]}" "${SLUG_ARGS[@]}" "${TEST_ARGS[@]}" --media "${IN_MEDIA}" --status draft --yes "${UPDATE_ARGS[@]}" "${ONLY_ARGS[@]}"
                ;;
              publish-live)
                wp-publish publish "$f" "${TYPE_ARGS[@]}" "${SLUG_ARGS[@]}" "${TEST_ARGS[@]}" --media "${IN_MEDIA}" --status publish --yes "${UPDATE_ARGS[@]}" "${ONLY_ARGS[@]}"
                ;;
              *)
                echo "::error::Unknown mode: ${IN_MODE}"; exit 1 ;;
            esac
            rc=$?
            set -e
            echo "::endgroup::"
            if [ $rc -ne 0 ]; then
              echo "::warning::${f} failed (exit ${rc})"
              FAILED+=("$f")
            fi
          done

          if [ ${#FAILED[@]} -gt 0 ]; then
            echo "::error::${#FAILED[@]} file(s) failed: ${FAILED[*]}"
            # A surgical run over ALL_ISLANDS tolerates per-island refusals (e.g. a
            # missing -test page); only fail the job if EVERY file failed.
            if [ ${#FAILED[@]} -eq ${#FILES[@]} ]; then exit 1; fi
          fi

      - name: Upload preview artifacts
        if: ${{ inputs.mode == 'preview' }}
        uses: actions/upload-artifact@v4
        with:
          name: preview-output
          path: output/
          if-no-files-found: ignore
