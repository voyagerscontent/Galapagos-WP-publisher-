[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "galapagos-wp-publisher"
version = "0.1.0"
description = "Turn a doc into a fully formatted, SEO-optimized, schema-rich WordPress page using per-page-type templates."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "LatinTrails" }]
license = { text = "Proprietary" }
dependencies = [
    "requests>=2.31",
    "python-docx>=1.1",
    "python-frontmatter>=1.1",
    "markdown>=3.6",
    "beautifulsoup4>=4.12",
    "PyYAML>=6.0",
    "Jinja2>=3.1",
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13.7",
    "python-slugify>=8.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
gdrive = [
    "google-api-python-client>=2.120",
    "google-auth>=2.29",
    "google-auth-oauthlib>=1.2",
    "google-auth-httplib2>=0.2",
]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "ruff>=0.4",
]

[project.scripts]
wp-publish = "galapagos_publisher.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"galapagos_publisher" = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
