# ─────────────────────────────────────────────────────────────
# Itineraries page (a multi-day land/island tour route — e.g.
# "14 Days Galápagos Land Tour", "5-Day Highlights Itinerary").
#
# Dedicated "itinerary" custom post type (its own menu: Itineraries → Add New
# Itinerary). A published itinerary must land in that CPT — not the generic WP
# `post`, and not flattened to `page` by the pages-only site default. The REST
# base equals the post_type slug, so the engine writes to /wp/v2/itinerary.
#
# ACF-driven: content maps into the "Itineraries" ACF group
# (config/acf/itineraries.yaml → group_itineraries_2026), which attaches by the
# gp_page_type marker (== itineraries) — the pipeline auto-stamps
# gp_page_type = this template's key on every post, so the group attaches on the
# CPT regardless of how it is located. The itinerary-specific fields (duration,
# gallery, map, the linked `cruise` post object, day_by_day meals) are authored
# in Elementor / WP; the engine only fills the editorial text it can reliably
# extract from the document.
#
# Route to it explicitly with `--type itineraries` (the dedicated n8n
# Itineraries form sends page_type=itineraries). NOTE the split: the page-type
# KEY is `itineraries` (matches the ACF marker + n8n form value); the WordPress
# post_type is `itinerary` (the CPT slug).
# ─────────────────────────────────────────────────────────────
key: itineraries
name: Itineraries
description: >
  A multi-day itinerary/land-tour page: intro, an "At a Glance" facts grid,
  editorial feature sections, day-by-day route, FAQs, a plan-your-trip CTA and
  related links. Published to the `itinerary` CPT; content maps into the
  "Itineraries" ACF group and renders via the Galápagos Site Widgets. Uses
  TouristTrip schema (taken verbatim from the document when present — never
  generated).
post_type: itinerary
status: draft
# The pipeline auto-stamps gp_page_type = this template's key (itineraries) on
# every post, which is what attaches the "Itineraries" ACF group (located by
# gp_page_type == itineraries) and targets the Elementor template.
page_meta:
  gp_page_type: itineraries
acf_profile: itineraries
schema_type: TouristTrip
categories: []
tags: []
focus_keyword_from: destination

layout:
  - { slot: overview, kind: section, required: true, show_heading: false }
  - { slot: highlights, kind: section, heading: "Highlights", style: list }
  - { slot: itinerary, kind: section, heading: "Itinerary" }
  - { slot: body, kind: section }
  - { slot: faq, kind: faq }

# Itinerary docs open with a lead paragraph rather than an "Overview" heading,
# so nothing is strictly required (avoids a spurious warning).
required_sections: []

schema_extra:
  touristType:
    - "Land Tour"
    - "Wildlife"
    - "Nature"
